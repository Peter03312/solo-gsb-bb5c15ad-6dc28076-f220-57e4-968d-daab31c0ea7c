services:
  db:
    image: postgres:16-alpine
    container_name: labflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labflow}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labpass}
    volumes:
      - labflow_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab} -d ${POSTGRES_DB:-labflow}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    container_name: labflow-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-labpass}@db:5432/${POSTGRES_DB:-labflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-labflow}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labpass}
      SEED_DEFAULT_STAFF: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      APP_PORT: "8000"
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  labflow_pgdata:
